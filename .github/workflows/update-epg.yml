name: Update EPG

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your repository
      - name: Check out repository
        uses: actions/checkout@v5

      # 2. Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # 3. Download the latest iptv-org EPG tools
      - name: Download iptv-org EPG tools
        run: |
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg

      # 4. Install iptv-org dependencies
      - name: Install EPG dependencies
        working-directory: epg
        run: npm install

      # 5. Generate the primary guide from iptv-org
      - name: Generate iptv-org guide
        working-directory: epg
        run: |
          npm run grab -- \
            --channels=../custom_epg_channels.xml \
            --output=../guide-iptv-org.xml \
            --lang=en

      # 6. Install Python dependencies for the fallback merger
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # 7. Apply EPG.PW fallback schedules
      - name: Apply EPG.PW fallbacks
        run: |
          python scripts/merge_epg_pw.py

      # 8. Verify final guide
      - name: Verify guide.xml
        run: |
          if [ ! -f guide.xml ]; then
            echo "ERROR: guide.xml was not created."
            exit 1
          fi

          echo "guide.xml created successfully."
          echo "File size:"
          du -h guide.xml

          echo "Number of channels:"
          grep -c "<channel " guide.xml || true

          echo "Number of programmes:"
          grep -c "<programme " guide.xml || true

      # 9. Commit the updated guide
      - name: Commit updated guide.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add guide.xml

          if git diff --cached --quiet; then
            echo "No changes to guide.xml."
          else
            git commit -m "Update EPG"
            git push
          fi
