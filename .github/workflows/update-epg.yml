name: Update EPG

on:
  schedule:
    # Run every day at 03:00 UTC
    - cron: "0 3 * * *"

  # Allows manual execution from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your repository
      - name: Check out repository
        uses: actions/checkout@v5

      # 2. Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # 3. Download the latest iptv-org EPG grabber
      - name: Download iptv-org EPG tools
        run: |
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg

      # 4. Install EPG grabber dependencies
      - name: Install EPG dependencies
        working-directory: epg
        run: npm install

      # 5. Generate guide.xml from your custom channel list
      - name: Generate guide.xml
        working-directory: epg
        run: |
          npm run grab -- \
            --channels=../custom_epg_channels.xml \
            --output=../guide.xml \
            --lang=en

      # 6. Verify that guide.xml was created
      - name: Verify guide.xml
        run: |
          if [ ! -f guide.xml ]; then
            echo "ERROR: guide.xml was not created."
            exit 1
          fi

          echo "guide.xml created successfully."
          echo "File size:"
          du -h guide.xml

          echo "Number of programmes:"
          grep -c "<programme " guide.xml || true

      # 7. Commit the updated guide.xml
      - name: Commit updated guide.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add guide.xml

          if git diff --cached --quiet; then
            echo "No changes to guide.xml."
          else
            git commit -m "Update EPG"
            git push
          fi
